<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniMic</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="widget">
    <div id="bubble-area">
      <div id="bubble" class="state-idle">
        <svg id="mic-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <div id="pulse-ring"></div>
      </div>
    </div>
    <div id="transcript-panel" class="hidden">
      <div id="transcript-text"></div>
      <div id="transcript-status"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
